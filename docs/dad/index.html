<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GD4Final</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <button id="dad-fullscreen-button" type="button" aria-label="Enter fullscreen">↗</button>
      <div id="unity-loading-bar" aria-live="polite">
        <div id="tile-layer" class="tile-layer" aria-hidden="true"></div>
        <div class="loader-ui">
          <div class="loader-row">
            <div class="loader-word">LOADING</div>
            <div id="loading-status" class="loader-foot">LOADING ASSETS</div>
            <div id="loading-percent" class="loader-percent">0%</div>
          </div>
          <div class="progress-track"><div id="unity-progress-bar-full" class="progress-fill"></div></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer"><div id="unity-fullscreen-button"></div><div id="unity-build-title">GD4Final</div></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var tileLayer = document.querySelector("#tile-layer");
      var remix = {
        tileSize:108,density:7,tileText:"DAD",fontSize:36,letterSpacing:-12,lineHeight:100,stroke:1,
        angle:45,tileOpacity:14,scrollX:0,scrollY:0,motionAxis:"horizontal",motionDistance:60,
        breathAmount:4,breathOpacity:4,breathSpeed:4.5,breathEasing:"sine",breathPhase:0,
        ink:"#080808",paper:"#f4f4f0",accent:"#f4f4f0"
      };
      var motionStart = performance.now(), lastFrame = motionStart, driftX = 0, driftY = 0, breathCycle = 0;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        var div = document.createElement("div"); div.innerHTML = msg; warningBanner.appendChild(div);
        div.style = type === "error" ? "background:red;padding:10px" : "background:#f4f4f0;color:#080808;padding:10px";
        setTimeout(function(){ if(div.parentNode) div.parentNode.removeChild(div); }, 5000);
      }
      function readRemixConfig() {
        return fetch("TemplateData/dad-loading-remix.json", {cache:"no-store"})
          .then(function(response){ return response.ok ? response.json() : {}; })
          .then(function(data){ remix = Object.assign(remix, data || {}); })
          .catch(function(){ /* embedded defaults keep the loader self-contained */ });
      }
      function buildPattern() {
        var cell = 280 - remix.density * 20;
        var cols = Math.ceil(2600 / cell) + 2, rows = Math.ceil(2000 / cell) + 2;
        tileLayer.innerHTML = "";
        tileLayer.style.setProperty("--cell-size", cell + "px");
        tileLayer.style.setProperty("--tile-font-size", remix.fontSize + "px");
        tileLayer.style.setProperty("--tile-letter-spacing", remix.letterSpacing + "%");
        tileLayer.style.setProperty("--tile-line-height", remix.lineHeight + "%");
        tileLayer.style.setProperty("--tile-stroke", remix.stroke + "px");
        tileLayer.style.setProperty("--pattern-angle", remix.angle + "deg");
        tileLayer.style.setProperty("--tile-opacity", remix.tileOpacity / 100);
        tileLayer.style.setProperty("--paper", remix.paper);
        tileLayer.style.setProperty("--ink", remix.ink);
        for (var r=0; r<rows; r++) {
          var row=document.createElement("div"); row.className="tile-row";
          row.style.transform="translateX(" + ((r % 2) * cell / 2) + "px)";
          for (var c=0; c<cols+2; c++) {
            var tile=document.createElement("div"); tile.className="tile";
            var glyph=document.createElement("span"); glyph.textContent=remix.tileText || "DAD";
            tile.appendChild(glyph); row.appendChild(tile);
          }
          tileLayer.appendChild(row);
        }
      }
      function applyBreath(wave) {
        var scale = 1 + wave * remix.breathAmount / 100;
        tileLayer.style.setProperty("--breath-scale", scale.toFixed(4));
        tileLayer.style.setProperty("--breath-opacity", Math.min(1, (remix.tileOpacity + wave * remix.breathOpacity) / 100).toFixed(4));
      }
      function animatePattern(now) {
        var dt = Math.min((now-lastFrame)/1000, .1); lastFrame=now;
        var cell = 280 - remix.density * 20;
        var step = dt * cell / 8.5 * remix.motionDistance / 90;
        if (remix.motionAxis === "horizontal" || remix.motionAxis === "diagonal") driftX = (driftX + step) % cell;
        if (remix.motionAxis === "vertical" || remix.motionAxis === "diagonal") driftY = (driftY + step) % (cell * 2);
        tileLayer.style.setProperty("--scroll-x", (remix.scrollX + driftX) + "px");
        tileLayer.style.setProperty("--scroll-y", (remix.scrollY + driftY) + "px");
        breathCycle = (breathCycle + dt / Math.max(.1, remix.breathSpeed)) % 1;
        var phase = (breathCycle + remix.breathPhase / 360) % 1;
        var triangle = 1 - Math.abs(phase * 2 - 1);
        var wave = remix.breathEasing === "linear" ? triangle : remix.breathEasing === "smooth" ? triangle*triangle*(3-2*triangle) : (1-Math.cos(triangle*Math.PI))/2;
        applyBreath(wave);
        window.requestAnimationFrame(animatePattern);
      }
      function startUnity() {
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/4cd8e08d00c6432267e49480c633922d.loader.js";
        var config = {
          arguments: [], dataUrl: buildUrl + "/c162c7d5e99fdeb40d2ade4b1506c55d.data", frameworkUrl: buildUrl + "/b72c558b84a84cea59ff30c64545ef27.framework.js", codeUrl: buildUrl + "/a9c003ee35efee94278cd006abca411d.wasm", matchWebGLToCanvasSize: true,
          streamingAssetsUrl: "StreamingAssets", companyName: "DefaultCompany", productName: "GD4Final", productVersion: "0.1.0", showBanner: unityShowBanner
        };
        var script=document.createElement("script"); script.src=loaderUrl;
        script.onload=function(){ createUnityInstance(canvas, config, function(progress){
          var percent=Math.round(100*progress);
          document.querySelector("#unity-progress-bar-full").style.width=percent+"%";
          document.querySelector("#loading-percent").textContent=percent+"%";
          document.querySelector("#loading-status").textContent=percent<35?"LOADING ASSETS":(percent<85?"BUILDING WORLD":"FINALIZING");
        }).then(function(unityInstance){ loadingBar.style.display="none"; document.querySelector("#dad-fullscreen-button").onclick=function(){unityInstance.SetFullscreen(1);}; }).catch(function(message){unityShowBanner(message,"error");}); };
        document.body.appendChild(script);
      }
      loadingBar.style.display="flex";
      readRemixConfig().then(function(){
        document.documentElement.style.setProperty("--ink", remix.ink);
        document.documentElement.style.setProperty("--paper", remix.paper);
        document.documentElement.style.setProperty("--accent", remix.accent);
        loadingBar.style.background=remix.ink;
        buildPattern(); window.requestAnimationFrame(animatePattern); startUnity();
      });
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { document.querySelector("#unity-container").className="unity-mobile"; canvas.className="unity-mobile"; }
      else { canvas.style.width="100%"; canvas.style.height="100%"; }
    </script>
  </body>
</html>
