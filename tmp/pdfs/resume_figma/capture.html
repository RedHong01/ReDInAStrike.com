<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=612, initial-scale=1">
    <title>Resume PDF Capture</title>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <style>
      html,
      body {
        margin: 0;
        width: 612px;
        min-width: 612px;
        height: 792px;
        background: #ffffff;
        overflow: hidden;
      }

      #resume-page {
        display: block;
        width: 612px;
        height: 792px;
        background: #ffffff;
      }

      #resume-page img {
        display: block;
        width: 612px;
        height: 792px;
      }
    </style>
  </head>
  <body>
    <main id="resume-page" aria-label="Resume PDF page">
      <img src="./resume_page-1.png" alt="Resume PDF page">
    </main>
  </body>
